name: Deploy PWA to GitHub Pages

# Builds the static export and publishes it to GitHub Pages.
# Assumes this runs in the `anaj-bahi` repo, so the production basePath is
# `/anaj-bahi` and the final URL is https://<owner>.github.io/anaj-bahi/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Match the repo's local pnpm (11.x). pnpm 9 rejects the settings-only
          # frontend/pnpm-workspace.yaml ("packages field missing or empty");
          # pnpm 11 reads its `allowBuilds` setting and installs cleanly.
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (it uses the node:sqlite built-in).
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export (production basePath /anaj-bahi)
        env:
          NEXT_PUBLIC_BASE_PATH: /anaj-bahi
          # Firebase web config — PUBLIC values (not secrets in the cryptographic
          # sense; real security is Firestore Rules), but stored as GitHub repo
          # secrets so they're not committed. Next inlines NEXT_PUBLIC_* at build.
          # Add these under: repo Settings → Secrets and variables → Actions.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          # Phase 13 — Bill Check (OPTIONAL). Unset ⇒ the Check-a-bill screen shows
          # a labelled "not set up yet" panel and the rest of the app is unaffected,
          # so the build never fails for want of this.
          #
          # WARNING: unlike the Firebase values above, this one is NOT guarded by
          # anything server-side. Next inlines it into the bundle, so it is readable
          # by anyone who opens devtools on the deployed site and is billable. Use a
          # DEDICATED key with an HTTP-referrer restriction and a hard quota cap —
          # see DEPLOY.md § Bill Check and spec/architecture.md § Bill Check.
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.NEXT_PUBLIC_GEMINI_API_KEY }}
          NEXT_PUBLIC_GEMINI_MODEL: ${{ secrets.NEXT_PUBLIC_GEMINI_MODEL }}
        run: pnpm build:pages

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
